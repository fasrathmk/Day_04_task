<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodmast</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-green-100">

<header class="px-4 py-5">
    <nav class="flex flex-wrap items-center justify-between gap-4">

        <!-- Logo -->
        <a href="#" class="font-bold text-xl">
            Prodmast
        </a>

        <!-- Mobile menu button -->
        <button
            id="menuButton"
            type="button"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="navMenu"
            class="cursor-pointer text-3xl md:hidden"
        >
            ☰
        </button>

        <!-- Navigation links and Sign Up -->
        <div
            id="navMenu"
            class="hidden w-full flex-col items-center gap-4
            md:flex md:w-auto md:flex-1 md:flex-row md:ml-8"
        >
            <ul class="flex flex-col items-center gap-4 md:flex-row md:mx-auto md:gap-8">
                <li>
                    <a href="#" class="hover:text-green-700">Home</a>
                </li>
                <li>
                    <a href="#" class="hover:text-green-700">About</a>
                </li>
                <li>
                    <a href="#" class="hover:text-green-700">Services</a>
                </li>
                <li>
                    <a href="#" class="hover:text-green-700">Contact</a>
                </li>
            </ul>

            <button
                type="button"
                class="cursor-pointer whitespace-nowrap rounded-full
                       bg-green-950 px-6 py-2 text-white"
            >
                Sign Up
            </button>
        </div>

    </nav>
</header>



<script>
    const menuButton = document.getElementById("menuButton");
    const navMenu = document.getElementById("navMenu");

    let isOpen = false;

    menuButton.addEventListener("click", function () {
        isOpen = !isOpen;

        navMenu.classList.toggle("hidden", !isOpen);
        navMenu.classList.toggle("flex", isOpen);

        menuButton.textContent = isOpen ? "×" : "☰";

        menuButton.setAttribute("aria-expanded", String(isOpen));
        menuButton.setAttribute(
            "aria-label",
            isOpen ? "Close menu" : "Open menu"
        );
    });
</script>
